<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission accomplie !</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bitter:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Bitter', Georgia, serif;
    background: radial-gradient(rgba(0,0,0,.12) 1.2px, transparent 1.4px) 0 0 / 10px 10px, #E8157E;
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 28px 20px; text-align: center; overflow-x: hidden;
  }
  .tag { font-family: 'Archivo Black', sans-serif; font-size: 13px; letter-spacing: 3px; background: #111; color: #FFE600;
         padding: 6px 14px; transform: rotate(-3deg); box-shadow: 3px 3px 0 #FFE600; }
  h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 15vw, 96px); line-height: .95;
       margin: 22px 0 6px; text-shadow: 5px 5px 0 #111; }
  h1 span { color: #FFE600; }
  .sub { font-style: italic; font-weight: 700; font-size: 17px; margin-bottom: 26px; }
  .card { background: #fff; color: #111; border: 3px solid #111; box-shadow: 8px 8px 0 #111; padding: 22px 22px 24px;
          max-width: 420px; width: 100%; transform: rotate(-1deg); }
  .card .lab { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 2px; color: #E8157E; margin-bottom: 10px; }
  .card p { font-family: 'Anton', Impact, sans-serif; font-size: clamp(26px, 8vw, 36px); line-height: 1.15; }
  .stamp { margin-top: 26px; border: 4px solid #FFE600; color: #FFE600; font-family: 'Archivo Black', sans-serif;
           font-size: 15px; letter-spacing: 2px; padding: 6px 14px; transform: rotate(4deg); }
  .foot { margin-top: 26px; font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 2px; color: #111; }
  .c { position: fixed; top: -20px; width: 10px; height: 16px; opacity: .9; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
  <div class="tag">MISSION ACCOMPLIE</div>
  <h1>JOYEUX<br><span>ANNIVERSAIRE !</span></h1>
  <div class="sub">Madame la Directrice a résolu l'énigme.</div>
  <div class="card">
    <div class="lab">TON CADEAU SE TROUVE…</div>
    <p>Dans le placard où tu mets tes sacs de supermarché.</p>
  </div>
  <div class="stamp">CLASSÉ SECRET</div>
  <div class="foot">BEST OF DÉGÂTS MAGAZINE</div>
<script>
  const cols = ['#FFE600', '#111', '#fff'];
  for (let i = 0; i < 90; i++) {
    const d = document.createElement('div');
    d.className = 'c';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % 3];
    d.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    d.style.animationDelay = (Math.random() * 2) + 's';
    document.body.appendChild(d);
  }
</script>
</body>
</html>
